name: amestar-app

on:
  workflow_dispatch:
    inputs:
      engine:
        description: 'Put the Starling engine (Rust, 26.3) in the APK. Slow: about 20 minutes'
        type: boolean
        default: false
      light:
        description: 'Skip the Java runtime and LWJGL (much smaller APK, UI testing only; Java games cannot start)'
        type: boolean
        default: true

concurrency:
  group: amestar-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: amethyst
    steps:
      - uses: actions/checkout@v4

      - name: Engine - Python and Java 25 (the exporters)
        if: ${{ inputs.engine }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine - Java 25
        if: ${{ inputs.engine }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Engine - Android build-tools and NDK
        if: ${{ inputs.engine }}
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null

      - name: Engine - Rust and cargo-ndk
        if: ${{ inputs.engine }}
        working-directory: .
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component rust-src --target aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Engine - Rust cache
        if: ${{ inputs.engine }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: amestar-arm64-v8a

      - name: Engine - build Starling and stage it into the app
        if: ${{ inputs.engine }}
        working-directory: .
        run: python3 packaging/android/stage_gradle.py --profile quick

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: No engine - the game theme the manifest names
        if: ${{ !inputs.engine }}
        run: |
          cat > app_pojavlauncher/src/main/res/values/starling_stub.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Starling.Game" parent="android:Theme.Material.NoActionBar"/>
          </resources>
          XML

      - name: Get JRE 8
        if: ${{ !inputs.light }}
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Strip game-only files (light)
        if: ${{ inputs.light }}
        run: |
          # The LWJGL jars (22 MB) and the Java runtime only matter once a Java game starts;
          # the launcher logs and skips their unpacking when they are missing.
          rm -rf app_pojavlauncher/src/main/assets/components/lwjgl3
          rm -rf app_pojavlauncher/src/main/assets/components/jre

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Language list
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build debug APK (arm64-v8a)
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/amestar-arm64-v8a.apk

      - name: Slim the APK (light)
        if: ${{ inputs.light }}
        run: |
          # Gradle regenerates the LWJGL files and bundles every CPU's natives; drop what only a
          # Java game needs, then align and sign again with the same debug key (updates in place).
          cd out
          zip -qd amestar-arm64-v8a.apk 'assets/components/lwjgl*' 'assets/components/jre/*' \
            'lib/arm64-v8a/libzink_dri.so' 'lib/arm64-v8a/libvulkan_freedreno.so' \
            'lib/arm64-v8a/libGLESv2_angle.so' || true
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 amestar-arm64-v8a.apk aligned.apk
          "$BT/apksigner" sign --ks ../app_pojavlauncher/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey --out amestar-arm64-v8a.apk aligned.apk
          rm -f aligned.apk amestar-arm64-v8a.apk.idsig
          "$BT/apksigner" verify amestar-arm64-v8a.apk

      - name: What is in the APK (largest first)
        run: |
          ls -l out
          unzip -lv out/amestar-arm64-v8a.apk | sort -k1 -n -r | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: amestar-arm64-v8a
          path: amethyst/out/amestar-arm64-v8a.apk
          retention-days: 30
