name: amethyst-android

on:
  workflow_dispatch:
    inputs:
      light:
        description: 'Skip the Java runtime and LWJGL (much smaller APK, UI testing only; Java games cannot start)'
        type: boolean
        default: true

concurrency:
  group: amethyst-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: amethyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8
        if: ${{ !inputs.light }}
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Strip game-only files (light)
        if: ${{ inputs.light }}
        run: |
          # The LWJGL jars (22 MB) and the Java runtime only matter once a Java game starts;
          # the launcher logs and skips their unpacking when they are missing.
          rm -rf app_pojavlauncher/src/main/assets/components/lwjgl3
          rm -rf app_pojavlauncher/src/main/assets/components/jre

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Language list
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build debug APK (arm64-v8a)
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/amestar-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: amestar-arm64-v8a
          path: amethyst/out/amestar-arm64-v8a.apk
          retention-days: 30
