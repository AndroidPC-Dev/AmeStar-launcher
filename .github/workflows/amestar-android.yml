name: amestar-android
# AmeStar's Android build: one APK, arm64-v8a (64-bit ARM), nothing else. Runs by hand only
# from the Actions tab ("Run workflow"). The APK is kept as an artifact for 30 days.
#
# Signing: with the secret AMESTAR_KEYSTORE_BASE64 (a base64 of your .jks, plus AMESTAR_KEY_ALIAS,
# AMESTAR_STORE_PASSWORD, AMESTAR_KEY_PASSWORD) every build is signed with your own key, so a new APK installs over
# the old one. Without it, build_apk.py signs with a throwaway key: it installs, but the next build must be
# uninstalled first.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile. quick = faster to build, for testing; fast = for the final version (slower to build, quicker in game)
        type: choice
        options: [quick, fast]
        default: quick
permissions:
  contents: read
concurrency:
  group: amestar-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component rust-src --target aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: amestar-arm64-v8a
      - name: Unpack your signing key
        env:
          KEYSTORE: ${{ secrets.AMESTAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "No AMESTAR_KEYSTORE_BASE64: signing with a throwaway key"; exit 0; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/amestar.jks"
          echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/amestar.jks" >> "$GITHUB_ENV"
      # The fast profile needs more memory than the runner has: swap on its large temporary disk, three jobs at a time.
      - name: Make room for the fast profile
        if: ${{ (inputs.profile || 'quick') == 'fast' }}
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
      - name: The game and the mod API as dylibs
        run: python3 tools/android_native_sdk.py prepare
      - name: Build the APK
        env:
          RUSTFLAGS: -C prefer-dynamic
          HORIZON_ANDROID_KEY_ALIAS: ${{ secrets.AMESTAR_KEY_ALIAS || 'horizon-debug' }}
          HORIZON_ANDROID_STORE_PASSWORD: ${{ secrets.AMESTAR_STORE_PASSWORD }}
          HORIZON_ANDROID_KEY_PASSWORD: ${{ secrets.AMESTAR_KEY_PASSWORD }}
        run: python3 packaging/android/build_apk.py --abi arm64-v8a --profile "${{ inputs.profile || 'quick' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: amestar-arm64-v8a
          # Only the final, signed APK: the build also leaves base, unsigned and aligned ones.
          path: target/android/starling-*.apk
          if-no-files-found: error
          retention-days: 30
